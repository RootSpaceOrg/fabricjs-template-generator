<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Anton:400|Manrope:400,600">
</head>
<body>
<!-- CTA (fechamento) — espelha a capa: os mesmos arcos, o profissional agora
     à ESQUERDA e a leitura à direita. A fita abre e fecha com ele presente,
     mas a inversão evita que o último slide pareça a capa repetida. -->
<main class="fita" data-pack="clinical-photo-editorial" data-template-name="cta" data-segment="exemplar">
  <section class="slide" data-role="fechamento">
    <img class="ds-photo" data-el-id="f1" data-static data-layer data-image-type="generated"
         src="arcos.svg" style="grid-area: 1 / 1 / 13 / 13">

    <img class="ds-slot" data-el-id="f2" data-static data-slot="professionalPhoto" data-cutout
         src="professional-photo-1.png" style="grid-area: 3 / 1 / 13 / 7">

    <span class="ds-stamp" data-el-id="f3" data-align="right" data-template-element
          data-te-description="rótulo do fechamento" data-te-min-chars="6" data-te-max-chars="26"
          style="grid-area: 2 / 7 / 3 / 12">LEVE PARA A CONSULTA</span>

    <h2 class="ds-headline" data-el-id="f4" data-align="right" data-layer data-template-element
        data-te-description="tese do fechamento" data-te-min-chars="8" data-te-max-chars="34"
        style="grid-area: 3 / 4 / 6 / 12">PERGUNTE.<br><span data-tone="accent">ENTENDA.</span></h2>

    <p class="ds-body" data-el-id="f5" data-align="right" data-template-element
       data-te-description="apoio curto" data-te-min-chars="20" data-te-max-chars="110"
       style="grid-area: 6 / 7 / 8 / 12">Objetivo, parâmetros e sinais fazem parte da conversa — leve suas dúvidas.</p>

    <a class="ds-cta" data-el-id="f6" data-template-element
       data-te-description="cta" data-te-min-chars="6" data-te-max-chars="26"
       style="grid-area: 9 / 8 / 10 / 12">SALVE ESTE GUIA</a>

    <img class="ds-slot" data-el-id="f7" data-static data-slot="logo" data-inset="bottom"
         src="logo-quadrada.png" style="grid-area: 11 / 9 / 12 / 11">
  </section>
</main>
</body>
</html>
