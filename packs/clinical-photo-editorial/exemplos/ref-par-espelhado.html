<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Anton:400|Manrope:400,600">
</head>
<body>
<main class="fita" data-pack="clinical-photo-editorial" data-template-name="par espelhado" data-segment="exemplar">
  <!-- E6a · PAR ESPELHADO (1/2) — leitura à ESQUERDA, foto à direita
       Primeira metade do par: a foto vive na .fita-layer e atravessa a emenda
       para o slide seguinte. Aqui ela entra pela direita. -->
  <section class="slide" data-role="item">
    <span class="ds-eyebrow" data-el-id="e6a" data-static style="grid-area: 2 / 2 / 3 / 7">DURANTE A SESSÃO</span>
    <h2 class="ds-headline" data-el-id="e6b" data-template-element
        data-te-description="tese" data-te-min-chars="10" data-te-max-chars="40"
        style="grid-area: 3 / 2 / 6 / 7">A APLICAÇÃO SEGUE O <span data-tone="accent">PLANO</span>.</h2>
    <p class="ds-body" data-el-id="e6c" data-template-element
       data-te-description="apoio" data-te-min-chars="20" data-te-max-chars="110"
       style="grid-area: 6 / 2 / 8 / 7">Área, dose e tempo saem da avaliação — não de um protocolo padrão.</p>
    <span class="ds-number" data-el-id="e6d" data-static data-size="lg" data-tone="accent"
          style="grid-area: 9 / 2 / 12 / 5">03</span>
  </section>
  <!-- E6b · PAR ESPELHADO (2/2) — foto continua da esquerda, leitura à DIREITA
       A mesma foto do slide anterior segue aqui: quem passa o dedo vê a imagem
       correr e o texto trocar de lado. O espelhamento é a transição. -->
  <section class="slide" data-role="fechamento">
    <span class="ds-eyebrow" data-el-id="e6e" data-static data-align="right"
          style="grid-area: 2 / 7 / 3 / 12">DEPOIS DELA</span>
    <h2 class="ds-headline" data-el-id="e6f" data-template-element data-align="right"
        data-te-description="tese" data-te-min-chars="10" data-te-max-chars="40"
        style="grid-area: 3 / 7 / 6 / 12">O QUE VOCÊ SENTE <span data-tone="accent">VOLTA</span>.</h2>
    <p class="ds-body" data-el-id="e6g" data-template-element data-align="right"
       data-te-description="apoio" data-te-min-chars="20" data-te-max-chars="110"
       style="grid-area: 6 / 7 / 8 / 12">Cada relato ajusta a próxima sessão. É assim que o plano acompanha você.</p>
    <a class="ds-cta" data-el-id="e6h" data-template-element
       data-te-description="cta" data-te-min-chars="6" data-te-max-chars="28"
       style="grid-area: 10 / 7 / 11 / 12">SALVE ESTE GUIA</a>
  </section>
  <div class="fita-layer">
    <!-- A foto do par: colunas 8→18 = metade direita do slide 1 + metade
         esquerda do slide 2 (grid contínuo: 12 colunas por slide). O conversor emite o objeto nos dois vizinhos com o
         centro deslocado; o Fabric clipa o que passa da borda de cada canvas. -->
    <img class="ds-photo" data-el-id="f1" data-static data-layer data-image-type="generated"
         src="foto-larga.jpg" style="grid-area: 1 / 8 / 13 / 18">
  </div>
</main>
</body>
</html>
