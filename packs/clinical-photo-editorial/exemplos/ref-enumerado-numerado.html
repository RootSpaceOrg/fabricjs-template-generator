<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Anton:400|Manrope:400,600">
</head>
<body>
<main class="fita" data-pack="clinical-photo-editorial" data-template-name="enumerado numerado" data-segment="exemplar">
  <!-- E3 · ENUMERADO COMO COLUNA NUMERADA
       A lista É a composição: número grande + item, ritmo regular do topo ao
       rodapé. Resolve enumerado sem virar bullet perdido. -->
  <section class="slide" data-role="item" data-invert data-variable="primary" data-variable-target="background">
    <span class="ds-eyebrow" data-el-id="e3a" data-static data-tone="paper"
          style="grid-area: 2 / 2 / 3 / 9">PARÂMETRO NÃO É DETALHE</span>
    <h2 class="ds-headline" data-el-id="e3b" data-template-element data-tone="paper"
        data-te-description="tese" data-te-min-chars="8" data-te-max-chars="36"
        style="grid-area: 3 / 2 / 5 / 11">NÃO EXISTE PROTOCOLO PRONTO.</h2>
    <span class="ds-number" data-el-id="e3c" data-static data-tone="paper" style="grid-area: 6 / 2 / 7 / 3">01</span>
    <p class="ds-body" data-el-id="e3d" data-template-element data-tone="paper"
       data-te-description="item 1" data-te-min-chars="4" data-te-max-chars="38"
       style="grid-area: 6 / 3 / 7 / 11">Área tratada</p>
    <span class="ds-number" data-el-id="e3e" data-static data-tone="paper" style="grid-area: 8 / 2 / 9 / 3">02</span>
    <p class="ds-body" data-el-id="e3f" data-template-element data-tone="paper"
       data-te-description="item 2" data-te-min-chars="4" data-te-max-chars="38"
       style="grid-area: 8 / 3 / 9 / 11">Dose por sessão</p>
    <span class="ds-number" data-el-id="e3g" data-static data-tone="paper" style="grid-area: 10 / 2 / 11 / 3">03</span>
    <p class="ds-body" data-el-id="e3h" data-template-element data-tone="paper"
       data-te-description="item 3" data-te-min-chars="4" data-te-max-chars="38"
       style="grid-area: 10 / 3 / 11 / 11">Objetivo clínico</p>
  </section>
</main>
</body>
</html>
