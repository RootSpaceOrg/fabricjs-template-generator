<main class="fita" data-pack="clinical-photo-editorial" data-template-name="display com decor" data-segment="exemplar">

    <img class="ds-photo" data-el-id="e5a" data-static data-layer data-image-type="generated"

        data-te-description="tese" data-te-min-chars="8" data-te-max-chars="30"

    <p class="ds-body" data-el-id="e5d" data-template-element
       data-te-description="apoio" data-te-min-chars="20" data-te-max-chars="120"
       style="grid-area: 8 / 2 / 10 / 9">O plano conversa com você: o que você sente volta para o acompanhamento.</p>
    <img class="ds-photo" data-el-id="e5e" data-static data-layer data-image-type="generated"
         data-overhang="bl" src="decor.png" style="grid-area: 10 / 1 / 13 / 4">
