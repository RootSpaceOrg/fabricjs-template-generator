<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Anton:400|Manrope:400,600">
</head>
<body>
<main class="fita" data-pack="clinical-photo-editorial" data-template-name="card ancorado" data-segment="exemplar">
  <!-- E4 · CARD ANCORADO NO RODAPÉ SOBRE FOTO
       Foto ocupa 2/3 do topo; cartão compacto encosta na margem inferior.
       Nada flutua no meio: dois blocos, um em cima, um embaixo. -->
  <section class="slide" data-role="item">
    <img class="ds-photo" data-el-id="e4a" data-static data-image-type="generated"
         src="foto-larga.jpg" style="grid-area: 1 / 1 / 9 / 13">
    <div class="ds-card" data-el-id="e4b" data-elevated data-layer data-fit="end"
         style="grid-area: 8 / 2 / 12 / 11">
      <span class="ds-eyebrow" data-el-id="e4c" data-static>ACOMPANHAMENTO</span>
      <h3 class="ds-headline" data-el-id="e4d" data-template-element
          data-te-description="título" data-te-min-chars="8" data-te-max-chars="30">O QUE LEVAR PARA O PLANO</h3>
      <p class="ds-body" data-el-id="e4e" data-template-element
         data-te-description="apoio" data-te-min-chars="20" data-te-max-chars="110">Relate sensações, conte como a rotina pesou e leve mudanças ao plano.</p>
    </div>
  </section>
</main>
</body>
</html>
