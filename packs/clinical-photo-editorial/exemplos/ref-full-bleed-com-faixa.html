<body>
<main class="fita" data-pack="clinical-photo-editorial" data-template-name="full bleed com faixa" data-segment="exemplar">
  <!-- E2 · FOTO FULL-BLEED + FAIXA DE LEITURA NO RODAPÉ
       O véu cobre só o terço inferior (não a foto inteira): a imagem respira
       em cima, o texto tem fundo sólido para contraste embaixo. -->
  <section class="slide" data-role="item">
    <img class="ds-photo" data-el-id="e2a" data-static data-image-type="generated"
         src="foto-larga.png" style="grid-area: 1 / 1 / 13 / 13">
    <span class="ds-stamp" data-el-id="e2b" data-static data-layer style="grid-area: 2 / 2 / 3 / 8">LUZ DE BAIXA INTENSIDADE</span>
    <div class="ds-block" data-el-id="e2c" data-variable="primary" data-static data-layer
         style="grid-area: 8 / 1 / 13 / 13"></div>
    <h2 class="ds-headline" data-el-id="e2d" data-template-element data-tone="paper" data-layer
        data-te-description="tese" data-te-min-chars="10" data-te-max-chars="42"
        style="grid-area: 9 / 2 / 11 / 12">PBM NÃO É PROMESSA PRONTA.</h2>
    <p class="ds-body" data-el-id="e2e" data-template-element data-tone="paper" data-layer
       data-te-description="apoio" data-te-min-chars="20" data-te-max-chars="120"
       style="grid-area: 11 / 2 / 12 / 11">Estudada para modular respostas locais — sem prever resposta igual para todo mundo.</p>
  </section>
</main>
