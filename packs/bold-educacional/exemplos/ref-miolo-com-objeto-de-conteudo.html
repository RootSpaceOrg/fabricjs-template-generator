<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Inter:500,700,800">
</head>
<body>
<!-- Cartao-lembrete COMPACTO sobre foto: o cartao e um objeto pousado na cena,
     dimensionado pelo texto (data-fit), assimetrico, tudo alinhado a esquerda. -->
<main class="fita" data-pack="bold-educacional" data-template-name="miolo com objeto de conteudo" data-segment="exemplar">
  <section class="slide" data-role="item">
    <img class="ds-photo" data-el-id="b1" data-static data-image-type="generated"
         src="photo-hands.png" style="grid-area: 1 / 1 / 13 / 13">
    <div class="ds-card" data-el-id="b2" data-elevated data-layer data-fit="end"
         style="grid-area: 6 / 2 / 12 / 10">
      <span class="ds-eyebrow" data-el-id="b3" data-template-element
            data-te-description="rótulo do lembrete" data-te-min-chars="4" data-te-max-chars="24">NA PRÁTICA</span>
      <h3 class="ds-headline" data-el-id="b4" data-case="sentence" data-template-element
          data-te-description="frase-lembrete" data-te-min-chars="10" data-te-max-chars="52">A dose certa <b>não</b> é a mais forte.</h3>
      <p class="ds-body" data-el-id="b5" data-template-element
         data-te-description="apoio" data-te-min-chars="20" data-te-max-chars="120">Parâmetro alto não acelera resposta — só aumenta o risco de irritar o tecido.</p>
    </div>
  </section>
</main>
</body>
</html>
