<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Inter:500,700,800">
</head>
<body>
<!-- STATEMENT CHAPADO (miolo/tese): fundo inteiro na primary do usuário,
     frase-tese gigante em cream com quebras dramáticas, mini-parágrafo de
     apoio no topo e colagem 3D sangrando pelo lado direito. -->
<main class="fita" data-pack="bold-educacional" data-template-name="statement chapado" data-segment="exemplar">
  <section class="slide" data-role="item" data-invert data-variable="primary" data-variable-target="background">
    <span class="ds-eyebrow" data-el-id="s1" data-static data-tone="paper"
          style="grid-area: 2 / 2 / 3 / 9">A PARTE QUE NINGUÉM CONTA</span>
    <p class="ds-body" data-el-id="s2" data-template-element data-tone="paper"
       data-te-description="apoio no topo" data-te-min-chars="20" data-te-max-chars="110"
       style="grid-area: 3 / 2 / 5 / 9">A luz não <b>apaga</b> a dor: ela muda como o tecido responde ao que você faz.</p>
    <h2 class="ds-headline" data-el-id="s3" data-size="lg" data-case="sentence" data-tone="paper"
        data-template-element data-te-description="frase-tese" data-te-min-chars="12" data-te-max-chars="46"
        style="grid-area: 5 / 2 / 10 / 11">Tratar não é<br>desligar o<br><b>sintoma.</b></h2>
    <img class="ds-photo" data-el-id="s4" data-static data-layer data-image-type="generated"
         data-overhang="br" src="badge-collage.png" style="grid-area: 8 / 8 / 13 / 13">
    <span class="ds-body" data-el-id="s5" data-static data-tone="paper"
          data-text-type="instagramHandle" style="grid-area: 12 / 2 / 13 / 7">@suaclinica</span>
  </section>
</main>
</body>
</html>
