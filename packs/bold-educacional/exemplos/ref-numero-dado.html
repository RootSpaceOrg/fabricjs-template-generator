<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Inter:500,700,800">
</head>
<body>
<!-- Numero-dado: o dado E a composicao. Numero gigante (fs-number-lg) com o
     contexto no topo e a leitura logo abaixo, mais a ressalva. -->
<main class="fita" data-pack="bold-educacional" data-template-name="numero dado" data-segment="exemplar">
  <section class="slide" data-role="fechamento">
    <span class="ds-eyebrow" data-el-id="d1" data-static style="grid-area: 2 / 2 / 3 / 10">O QUE A EVIDÊNCIA MOSTRA</span>
    <span class="ds-number" data-el-id="d2" data-static data-size="lg" data-tone="accent"
          style="grid-area: 3 / 2 / 6 / 8">6 a 12</span>
    <h2 class="ds-headline" data-el-id="d3" data-case="sentence" data-template-element
        data-te-description="o que o numero significa" data-te-min-chars="10" data-te-max-chars="46"
        style="grid-area: 5 / 2 / 8 / 11">sessões é a faixa mais estudada.</h2>
    <p class="ds-body" data-el-id="d4" data-template-element
       data-te-description="ressalva" data-te-min-chars="20" data-te-max-chars="120"
       style="grid-area: 8 / 2 / 10 / 10">Não é regra: a contagem sai da avaliação, do objetivo e da resposta de cada tecido.</p>
    <img class="ds-photo" data-el-id="d6" data-static data-layer data-image-type="generated"
         data-overhang="br" src="badge-collage.png" style="grid-area: 8 / 8 / 13 / 13">
    <a class="ds-cta" data-el-id="d5" data-square data-variable="primary" data-template-element
       data-te-description="cta" data-te-min-chars="6" data-te-max-chars="28"
       style="grid-area: 11 / 2 / 12 / 7">SALVE PARA PERGUNTAR</a>
  </section>
</main>
</body>
</html>
