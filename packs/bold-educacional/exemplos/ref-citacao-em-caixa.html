<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Inter:500,700,800">
</head>
<body>
<!-- Citacao em caixa: a fala do paciente vira o objeto do slide; a resposta
     profissional vem no mesmo bloco de leitura. Numero grande ancora o rodape. -->
<main class="fita" data-pack="bold-educacional" data-template-name="citacao em caixa" data-segment="exemplar">
  <section class="slide" data-role="item" data-invert data-variable="primary" data-variable-target="background">
    <span class="ds-eyebrow" data-el-id="c1" data-static data-tone="paper"
          style="grid-area: 2 / 2 / 3 / 10">O QUE OUÇO NO CONSULTÓRIO</span>
    <div class="ds-card" data-el-id="c2" data-elevated style="grid-area: 4 / 2 / 8 / 12">
      <h3 class="ds-headline" data-el-id="c3" data-case="sentence" data-template-element
          data-te-description="a fala do paciente" data-te-min-chars="15" data-te-max-chars="78">“Achei que uma sessão <b>já ia resolver</b>.”</h3>
      <p class="ds-body" data-el-id="c4" data-template-element
         data-te-description="resposta profissional" data-te-min-chars="20" data-te-max-chars="130">Resposta tecidual é acúmulo: cada sessão soma sobre a anterior, dentro de um plano.</p>
    </div>
    <span class="ds-number" data-el-id="c5" data-static data-size="lg" data-tone="paper"
          style="grid-area: 9 / 2 / 12 / 6">02</span>
    <img class="ds-photo" data-el-id="c6" data-static data-layer data-image-type="generated"
         data-overhang="br" src="clip-collage.png" style="grid-area: 9 / 9 / 13 / 13">
  </section>
</main>
</body>
</html>
