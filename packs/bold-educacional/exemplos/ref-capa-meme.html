<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Inter:500,700,800">
</head>
<body>
<!-- CAPA MEME (scroll-stop): foto full-bleed inusitada, byline no topo,
     headline sans-bold empilhada em sentence case e sub-headline em TARJA.
     O assunto da foto ocupa o meio-baixo, sem texto por cima. -->
<main class="fita" data-pack="bold-educacional" data-template-name="capa meme" data-segment="exemplar">
  <section class="slide" data-role="abertura">
    <img class="ds-photo" data-el-id="m1" data-static data-layer data-image-type="generated"
         src="meme-cat.jpg" style="grid-area: 1 / 1 / 13 / 13">
    <span class="ds-eyebrow" data-el-id="m2" data-static data-align="center"
          data-text-type="instagramHandle" style="grid-area: 1 / 4 / 2 / 10">@suaclinica</span>
    <h1 class="ds-headline" data-el-id="m3" data-case="sentence" data-align="center" data-template-element
        data-te-description="gancho de curiosidade" data-te-min-chars="15" data-te-max-chars="70"
        style="grid-area: 2 / 2 / 5 / 12">Seu joelho não<br>precisa doer<br><b>para sempre.</b></h1>
    <a class="ds-cta" data-el-id="m4" data-square data-variable="primary" data-template-element
       data-te-description="promessa concreta" data-te-min-chars="10" data-te-max-chars="40"
       style="grid-area: 5 / 3 / 6 / 11">O QUE A LUZ FAZ NO TECIDO</a>
  </section>
</main>
</body>
</html>
