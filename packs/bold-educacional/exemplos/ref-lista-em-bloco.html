<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Inter:500,700,800">
</head>
<body>
<!-- Lista em bloco: 2-3 itens curtos num bloco de acento. O tratamento mais leve
     do miolo — serve de respiro entre dois slides densos. -->
<main class="fita" data-pack="bold-educacional" data-template-name="lista em bloco" data-segment="exemplar">
  <section class="slide" data-role="item">
    <span class="ds-eyebrow" data-el-id="l1" data-static style="grid-area: 2 / 2 / 3 / 10">LEVE PARA A AVALIAÇÃO</span>
    <h2 class="ds-headline" data-el-id="l2" data-case="sentence" data-template-element
        data-te-description="tese" data-te-min-chars="10" data-te-max-chars="44"
        style="grid-area: 3 / 2 / 5 / 11">Três perguntas que <b>mudam</b> a conversa.</h2>
    <div class="ds-block" data-el-id="l3" data-static style="grid-area: 5 / 2 / 10 / 10">
      <p class="ds-body" data-el-id="l4" data-template-element data-tone="paper"
         data-te-description="item 1" data-te-min-chars="6" data-te-max-chars="46">Qual é o objetivo desta sessão?</p>
      <p class="ds-body" data-el-id="l5" data-template-element data-tone="paper"
         data-te-description="item 2" data-te-min-chars="6" data-te-max-chars="46">Como vamos medir se funcionou?</p>
      <p class="ds-body" data-el-id="l6" data-template-element data-tone="paper"
         data-te-description="item 3" data-te-min-chars="6" data-te-max-chars="46">O que eu faço entre uma e outra?</p>
    </div>
    <img class="ds-photo" data-el-id="l7" data-static data-layer data-image-type="generated"
         data-overhang="br" src="badge-collage.png" style="grid-area: 8 / 8 / 13 / 13">
  </section>
</main>
</body>
</html>
