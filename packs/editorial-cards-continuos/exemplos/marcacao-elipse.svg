<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" fill="none">
  <!-- Marcação manuscrita: elipse de caneta CIRCUNDANDO a palavra-chave.
       A proporção importa — elipse achatada demais vira risco em cima do
       texto em vez de contorno. 600×260 dá altura para a palavra caber
       dentro. O traço não fecha e passa do ponto de partida: é o gesto.
       O stroke usa o accent; recebe data-variable no <img> da fita. -->
  <path d="M 300 24
           C 148 24, 26 76, 26 130
           C 26 184, 148 236, 300 236
           C 452 236, 574 184, 574 130
           C 574 82, 470 34, 344 26
           C 302 23, 250 27, 210 38"
        stroke="#E95F40" stroke-width="6" stroke-linecap="round"/>
</svg>
