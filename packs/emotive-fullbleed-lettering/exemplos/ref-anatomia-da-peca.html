<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Poppins:600,700|Manrope:400,600">
</head>
<body>
<!-- Anatomia da peca unica, na ordem do DOM: foto full-bleed, gradiente da
     primary, lettering-arte, sparkles, data, copy, rodape e logo na base. -->
<main class="fita" data-pack="emotive-fullbleed-lettering" data-template-name="anatomia da peca" data-segment="exemplar">
  <section class="slide" data-role="unica">
    <img class="ds-photo" data-el-id="u1" data-static data-image-type="generated"
         src="photo-emocional.jpg" style="grid-area: 1 / 1 / 13 / 13">
    <div class="ds-block" data-el-id="u2" data-overlay-gradient="primary" data-layer
         style="grid-area: 1 / 1 / 13 / 13"></div>
    <img class="ds-photo" data-el-id="u3" data-static data-layer data-image-type="generated"
         src="lettering-pais.png" style="grid-area: 4 / 1 / 9 / 13">
    <img class="ds-photo" data-el-id="u4" data-static data-layer data-image-type="generated"
         src="sparkles.png" style="grid-area: 3 / 2 / 10 / 12">
    <span class="ds-eyebrow" data-el-id="u5" data-layer data-static data-tone="paper" data-align="center"
          style="grid-area: 9 / 4 / 10 / 10">09 DE AGOSTO</span>
    <p class="ds-body" data-el-id="u6" data-layer data-template-element data-tone="paper" data-align="center"
       data-te-description="homenagem" data-te-min-chars="20" data-te-max-chars="120"
       style="grid-area: 10 / 3 / 11 / 11">A quem ensina pelo exemplo e cuida em silêncio: obrigado por estar sempre por perto.</p>
    <p class="ds-body" data-el-id="u7" data-layer data-static data-tone="paper" data-align="center"
       data-text-type="phone" style="grid-area: 11 / 3 / 12 / 11" data-inset="top">(11) 99999-9999 · @suaclinica</p>
    <img class="ds-slot" data-el-id="u8" data-layer data-static data-slot="logo" data-inset="bottom"
         src="logo.png" style="grid-area: 12 / 6 / 13 / 8">
  </section>
</main>
</body>
</html>
