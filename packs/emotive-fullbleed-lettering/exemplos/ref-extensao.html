<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Poppins:600,700|Manrope:400,600">
</head>
<body>
<!-- Extensao para 2-3 slides: mesma foto e mesmo gradiente, SEM lettering
     (ele e assinatura da capa); a mensagem vem em texto. -->
<main class="fita" data-pack="emotive-fullbleed-lettering" data-template-name="extensao" data-segment="exemplar">
  <section class="slide" data-role="fechamento">
    <img class="ds-photo" data-el-id="x1" data-static data-image-type="generated"
         src="photo-emocional.jpg" style="grid-area: 1 / 1 / 13 / 13">
    <div class="ds-block" data-el-id="x2" data-overlay-gradient="primary" data-layer
         style="grid-area: 1 / 1 / 13 / 13"></div>
    <h2 class="ds-headline" data-el-id="x3" data-layer data-template-element data-tone="paper"
        data-case="sentence" data-align="center"
        data-te-description="mensagem" data-te-min-chars="10" data-te-max-chars="60"
        style="grid-area: 7 / 2 / 9 / 12">Cuidar também é presença.</h2>
    <p class="ds-body" data-el-id="x4" data-layer data-template-element data-tone="paper" data-align="center"
       data-te-description="apoio" data-te-min-chars="20" data-te-max-chars="130"
       style="grid-area: 9 / 3 / 11 / 11">Neste mês, nossa equipe está à disposição para conversar sobre o que o seu pai precisa.</p>
    <img class="ds-slot" data-el-id="x5" data-layer data-static data-slot="logo" data-inset="bottom"
         src="logo.png" style="grid-area: 12 / 6 / 13 / 8">
  </section>
</main>
</body>
</html>
