<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="hm-fonts" content="Montserrat:300,400,500,600,700,800">
</head>
<body>
<!-- PADRÃO: faixa de foto no topo, tese e apoio abaixo.
     O slide de respiro do pack — entra quando a fita já explicou a condição e
     precisa de uma pausa antes do fechamento. Uma imagem, uma tese curta, um
     parágrafo.

     A faixa NÃO sangra. Medido na lâmina: vai de 9.5% a 84.5% da largura, com
     margem dos dois lados (colunas 2..11). Foi um erro que cometi e o Gustavo
     apontou: sangrar de borda a borda descaracteriza — na referência a faixa é
     uma janela, não um full-bleed.

     A foto aqui é de FAIXA, não de travessia: pode ter fundo, não precisa de
     alpha, e não cruza emenda. Registro visual igual ao resto do pack (corpo
     com a área do sintoma em vermelho translúcido). -->
<main class="fita" data-pack="laserpro-continuo" data-template-name="Faixa de foto" data-segment="exemplar">

  <section class="slide" data-role="item">
    <img class="ds-photo" data-el-id="c1f" data-static data-image-type="generated"
         src="foto-faixa-dor.png" style="grid-area: 3 / 2 / 7 / 11">
    <h2 class="ds-headline" data-el-id="c1t" data-case="sentence" data-weight="light"
        data-template-element data-te-description="tese curta"
        data-te-min-chars="8" data-te-max-chars="26"
        style="grid-area: 8 / 2 / 10 / 10">O poder da luz</h2>
    <p class="ds-body" data-el-id="c1a" data-weight="thin" data-template-element
       data-te-description="apoio da tese"
       data-te-min-chars="60" data-te-max-chars="220"
       style="grid-area: 10 / 2 / 13 / 11">Pode ser usada sozinha ou junto de outros tratamentos, ajudando a evitar intervenções mais invasivas em muitos casos.</p>
  </section>

  <section class="slide" data-role="item">
    <h2 class="ds-headline" data-el-id="c2t" data-weight="light"
        data-template-element data-te-description="tese do slide"
        data-te-min-chars="10" data-te-max-chars="34"
        style="grid-area: 4 / 2 / 6 / 10">Quantas <b>sessões</b>?</h2>
    <p class="ds-body" data-el-id="c2a" data-weight="thin" data-template-element
       data-te-description="apoio"
       data-te-min-chars="60" data-te-max-chars="240"
       style="grid-area: 6 / 2 / 11 / 10">Depende da condição e de há quanto tempo ela existe. O plano sai da avaliação, não de um protocolo fixo.</p>
  </section>

  <div class="fita-layer" data-split-ok>
    <span class="ds-watermark" data-el-id="w1" data-static data-layer data-ghost
          style="grid-area: 10 / 9 / 13 / 20">LUZ</span>
  </div>

</main>
</body>
</html>
